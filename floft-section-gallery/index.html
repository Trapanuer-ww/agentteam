<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Площадка для любого мероприятия — F-Loft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/gallery-section.css">
</head>
<body style="margin:0;">

<section class="event-gallery">
  <h2 class="event-gallery__title">Площадка для любого<br>мероприятия</h2>

  <div class="event-gallery__grid">
    <div class="event-gallery__row event-gallery__row--top">
      <div class="event-gallery__item">
        <img src="assets/img/photo-1-speaker.webp" alt="Спикер выступает перед гостями в зале F-Loft">
      </div>
      <div class="event-gallery__item">
        <img src="assets/img/photo-2-gala.webp" alt="Банкетная рассадка гала-ужина в синем свете">
      </div>
    </div>
    <div class="event-gallery__row event-gallery__row--bottom">
      <div class="event-gallery__item">
        <img src="assets/img/photo-3-tables.jpg" alt="Круглые столы с сервировкой в зале">
      </div>
      <div class="event-gallery__item">
        <img src="assets/img/photo-4-greenery.webp" alt="Сервировка стола с зеленью и цветами">
      </div>
      <div class="event-gallery__item">
        <img src="assets/img/photo-5-drapery.webp" alt="Стол с драпировкой из ткани и свечами">
      </div>
    </div>
  </div>

  <div class="event-gallery__cta">
    <a class="event-gallery__button" href="https://f-loft.ru/gallery/">Посмотреть галерею</a>
  </div>
</section>

</body>
</html>
